<svg width="108" height="28" viewBox="0 0 108 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="demoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221028" />
      <stop offset="100%" stop-color="#341333" />
    </linearGradient>
    <linearGradient id="demoBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7597" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Capsule Pill Shape (rx = 14 for height 28) -->
  <rect x="0.8" y="0.8" width="106.4" height="26.4" rx="13.2" fill="url(#demoBg)" stroke="url(#demoBorder)" stroke-width="1.3" />

  <!-- Live Pulse Dot Indicator -->
  <circle cx="15" cy="14" r="5" fill="url(#dotGlow)" />
  <circle cx="15" cy="14" r="2.8" fill="#ff7597" />

  <!-- Japanese & English Label -->
  <text x="26" y="17.5" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="0.8">
    DEMO
  </text>
  <text x="63" y="17" fill="#fbcfe8" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="8.5" font-weight="700">
    実演
  </text>

  <!-- External Link Chevron Accent -->
  <path d="M 94 11 L 98 11 L 98 15 M 98 11 L 92 17" stroke="#ff7597" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
</svg>
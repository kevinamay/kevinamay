<svg width="186" height="44" viewBox="0 0 186 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgMail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0d16" />
      <stop offset="100%" stop-color="#36111f" />
    </linearGradient>
    <linearGradient id="strokeMail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <radialGradient id="iconGlowMail" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1f0d16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Capsule Pill Shape -->
  <rect x="1" y="1" width="184" height="42" rx="21" fill="url(#bgMail)" stroke="url(#strokeMail)" stroke-width="1.6" />

  <!-- Left Icon Circle Accent -->
  <circle cx="22" cy="22" r="14" fill="#3b1220" stroke="#fb7185" stroke-width="1" />
  <circle cx="22" cy="22" r="16" fill="url(#iconGlowMail)" />

  <!-- Vector Origami Letter Icon -->
  <g transform="translate(22, 22) scale(0.68)">
    <rect x="-9" y="-6.5" width="18" height="13" rx="1.5" fill="none" stroke="#fecdd3" stroke-width="1.5" />
    <path d="M -8.5 -5.5 L 0 1.5 L 8.5 -5.5" stroke="#fecdd3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="0" cy="1.5" r="1.5" fill="#f43f5e" />
  </g>

  <!-- Dual-Tier Typography -->
  <text x="44" y="17" fill="#fecdd3" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">
    便り • DIRECT MAIL
  </text>
  <text x="44" y="31" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.2">
    SEND AN EMAIL
  </text>

  <!-- Right Arrow Chevron -->
  <path d="M 166 18 L 170 22 L 166 26" stroke="#fb7185" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
</svg>
<svg width="186" height="44" viewBox="0 0 186 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f26" />
      <stop offset="100%" stop-color="#241442" />
    </linearGradient>
    <linearGradient id="strokeGh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>
    <radialGradient id="iconGlowGh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#140f26" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Capsule Pill Shape -->
  <rect x="1" y="1" width="184" height="42" rx="21" fill="url(#bgGh)" stroke="url(#strokeGh)" stroke-width="1.6" />

  <!-- Left Icon Circle Accent -->
  <circle cx="22" cy="22" r="14" fill="#261245" stroke="#c084fc" stroke-width="1" />
  <circle cx="22" cy="22" r="16" fill="url(#iconGlowGh)" />

  <!-- Vector Japanese Chōchin (Lantern) / Shrine Crest Icon -->
  <g transform="translate(22, 22) scale(0.65)">
    <!-- Lantern Top Hook & Cap -->
    <path d="M 0 -10 L 0 -8" stroke="#d8b4fe" stroke-width="1.5" />
    <rect x="-5" y="-8" width="10" height="2" rx="0.5" fill="#e9d5ff" />
    <!-- Lantern Oval Body -->
    <ellipse cx="0" cy="0" rx="7.5" ry="8" fill="#581c87" stroke="#c084fc" stroke-width="1.2" />
    <path d="M -6.5 -3 Q 0 -4 6.5 -3" stroke="#e9d5ff" stroke-width="0.8" fill="none" />
    <path d="M -7.2 0 Q 0 -1 7.2 0" stroke="#e9d5ff" stroke-width="0.8" fill="none" />
    <path d="M -6.5 3 Q 0 2 6.5 3" stroke="#e9d5ff" stroke-width="0.8" fill="none" />
    <!-- Lantern Bottom Cap & Tassel -->
    <rect x="-4" y="7.5" width="8" height="1.8" rx="0.5" fill="#e9d5ff" />
    <path d="M 0 9.3 L 0 12" stroke="#d8b4fe" stroke-width="1.4" />
  </g>

  <!-- Dual-Tier Typography -->
  <text x="44" y="17" fill="#e9d5ff" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">
    本拠地 • GITHUB
  </text>
  <text x="44" y="31" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.2">
    REPOSITORIES
  </text>

  <!-- Right Arrow Chevron -->
  <path d="M 166 18 L 170 22 L 166 26" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
</svg>
<svg width="108" height="28" viewBox="0 0 108 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="repoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#181f44" />
    </linearGradient>
    <linearGradient id="repoBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Capsule Pill Shape (rx = 14 for height 28) -->
  <rect x="0.8" y="0.8" width="106.4" height="26.4" rx="13.2" fill="url(#repoBg)" stroke="url(#repoBorder)" stroke-width="1.3" />

  <!-- Code / Repo Icon -->
  <g transform="translate(15, 14)">
    <path d="M -4.5 -3 L -7.5 0 L -4.5 3" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 4.5 -3 L 7.5 0 L 4.5 3" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 1.5 -4 L -1.5 4" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- Japanese & English Label -->
  <text x="26" y="17.5" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="0.8">
    REPO
  </text>
  <text x="63" y="17" fill="#bae6fd" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="8.5" font-weight="700">
    源庫
  </text>

  <!-- External Link Chevron Accent -->
  <path d="M 94 11 L 98 11 L 98 15 M 98 11 L 92 17" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
</svg>
<svg width="100%" height="200" viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#18153b" />
      <stop offset="100%" stop-color="#2d0b43" />
    </linearGradient>
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="waveGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background with smooth rounded borders -->
  <rect width="1000" height="200" rx="18" fill="url(#bgGradient)" stroke="#312e81" stroke-width="1.5" />

  <!-- Background Ambient Glows -->
  <circle cx="200" cy="50" r="90" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="800" cy="140" r="100" fill="#ec4899" opacity="0.1" filter="url(#glow)" />

  <!-- Geometric Waves -->
  <path d="M 0 145 C 220 115, 400 175, 600 135 C 780 100, 880 165, 1000 130 L 1000 200 L 0 200 Z" fill="url(#waveGradient2)" />
  <path d="M 0 160 C 260 125, 470 195, 720 145 C 860 115, 930 175, 1000 155 L 1000 200 L 0 200 Z" fill="url(#waveGradient1)" />

  <!-- Accent sparkles -->
  <circle cx="150" cy="50" r="2.5" fill="#a5b4fc" opacity="0.7" />
  <circle cx="860" cy="55" r="3" fill="#f472b6" opacity="0.6" />
  <circle cx="730" cy="35" r="2" fill="#c084fc" opacity="0.7" />
  <circle cx="280" cy="75" r="2" fill="#38bdf8" opacity="0.5" />

  <!-- Header Name -->
  <text x="500" y="85" text-anchor="middle" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="1">
    Kevina Maydiva Heriansaputri
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="500" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5">
    SOFTWARE ENGINEER  •  FULL-STACK &amp; MOBILE DEVELOPER
  </text>
</svg>
